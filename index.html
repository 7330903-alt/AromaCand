<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Аромат Уюта — Магазин свечей</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Шапка сайта -->
    <header>
        <div class="logo">Аромат Уюта</div>
        <nav>
            <a href="#catalog">Каталог</a>
            <a href="#about">О нас</a>
            <div id="cart-icon">🛒 <span id="cart-count">0</span></div>
        </nav>
    </header>

    <!-- Главный баннер -->
    <section class="hero">
        <h1>Свечи, которые согревают душу</h1>
        <p>Натуральный воск и неповторимые ароматы для вашего дома</p>
        <button onclick="scrollToCatalog()">Выбрать свечу</button>
    </section>

    <!-- Каталог товаров -->
    <main id="catalog">
        <h2>Наши изделия</h2>
        <div class="product-grid" id="product-list">
            <!-- Сюда JavaScript будет подгружать товары из базы -->
            <div class="product-card">
                <img src="https://via.placeholder.com/250x300" alt="Свеча">
                <h3>Лавандовый вечер</h3>
                <p>Успокаивающий аромат прованских трав</p>
                <span class="price">850 ₽</span>
                <button class="add-to-cart">В корзину</button>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
