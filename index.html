<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Аромат Уюта — Мастерская</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Главный баннер -->
    <section class="hero">
        <div class="hero-content">
            <h1>Аромат Уюта</h1>
            <p>Ручная работа. Натуральный воск. Ваша атмосфера.</p>
            <!-- Кнопка с классом btn-main -->
            <a href="#categories" class="btn-main">Смотреть каталог</a>
        </div>
    </section>

    <!-- Сетка категорий -->
    <section id="categories" class="category-grid">
        
        <!-- Блок: Свечи -->
        <div class="category-item olive-bg" id="candles-block">
            <div class="category-info" onclick="toggleCategory('candles-block')">
                <h3>Свечи</h3>
                <p>Ароматические и интерьерные</p>
            </div>
            <div class="preview-box">
                <div class="mini-products">
                    <a href="candles.html" class="item-link">🕯️ Лаванда</a>
                    <a href="candles.html" class="item-link">🕯️ Хвоя</a>
                </div>
                <a href="candles.html" class="btn-more">Перейти в каталог</a>
            </div>
        </div>

        <!-- Блок: Творчество -->
        <div class="category-item sage-bg" id="materials-block">
            <div class="category-info" onclick="toggleCategory('materials-block')">
                <h3>Творчество</h3>
                <p>Воск, фитили и формы</p>
            </div>
            <div class="preview-box">
                <div class="mini-products">
                    <a href="#" class="item-link">🍯 Воск</a>
                    <a href="#" class="item-link">🧵 Фитили</a>
                </div>
                <a href="#" class="btn-more">Все материалы</a>
            </div>
        </div>

        <!-- Блок: Декор -->
        <div class="category-item dark-olive-bg" id="decor-block">
            <div class="category-info" onclick="toggleCategory('decor-block')">
                <h3>Декор</h3>
                <p>Аксессуары для дома</p>
            </div>
            <div class="preview-box">
                <div class="mini-products">
                    <a href="#" class="item-link">🏺 Гипс</a>
                    <a href="#" class="item-link">🪵 Подставки</a>
                </div>
                <a href="#" class="btn-more">Весь декор</a>
            </div>
        </div>

    </section>

    <script src="script.js"></script>
</body>
</html>
