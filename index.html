<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Аромат Уюта — Мастерская</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Главный баннер -->
    <section class="hero">
        <div class="hero-content">
            <h1>Аромат Уюта</h1>
            <p>Ручная работа. Натуральный воск.</p>
            <!-- Добавлен класс btn-main для вида кнопки -->
            <a href="candles.html" class="btn-main">Смотреть каталог</a>
        </div>
    </section>

    <!-- Сетка категорий -->
    <section id="categories" class="category-grid">
        
        <!-- Блок: Свечи -->
        <div class="category-item olive-bg">
            <div class="category-info">
                <h3>Свечи</h3>
                <p>Ароматические и интерьерные</p>
            </div>
            <div class="preview-box">
                <a href="candles.html" class="btn-more">Перейти в каталог</a>
            </div>
        </div>

        <!-- Блок: Творчество -->
        <div class="category-item sage-bg">
            <div class="category-info">
                <h3>Творчество</h3>
                <p>Все для создания свечей</p>
            </div>
            <div class="preview-box">
                <a href="#" class="btn-more">Смотреть материалы</a>
            </div>
        </div>

    </section>

</body>
</html>
