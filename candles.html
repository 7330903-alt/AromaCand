<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог свечей — Аромат Уюта</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="catalog-header">
        <a href="index.html" class="btn-back">← На главную</a>
        <h1>Наши свечи</h1>
    </header>

    <main class="catalog-container">
        <div class="product-grid">
            <div class="product-card">
                <div class="product-image">🕯️</div>
                <div class="product-info">
                    <h3>Лавандовый вечер</h3>
                    <p>Натуральный воск. 30 часов горения.</p>
                    <span class="price">850 ₽</span>
                    <button class="btn-buy">Выбрать</button>
                </div>
            </div>
            <div class="product-card">
                <div class="product-image">🕯️</div>
                <div class="product-info">
                    <h3>Утро в лесу</h3>
                    <p>Аромат хвои и свежести.</p>
                    <span class="price">900 ₽</span>
                    <button class="btn-buy">Выбрать</button>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
